pluginManagement {
    plugins {
        id 'org.springframework.boot' version '4.0.3'
        id 'io.spring.dependency-management' version '1.1.7'
        id 'io.freefair.lombok' version '8.6'
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'aws-bdr-ms-integracion-customer-core-adapter-java'

include 'domain'
include 'application'
include 'infrastructure'
include 'infrastructure:aspect'
include 'infrastructure:entry-point'
include 'infrastructure:entry-point:rest'
include 'infrastructure:driven-adapter'
include 'infrastructure:driven-adapter:auth'
include 'infrastructure:driven-adapter:cache'
include 'infrastructure:driven-adapter:feign'
include 'infrastructure:driven-adapter:metrics'
